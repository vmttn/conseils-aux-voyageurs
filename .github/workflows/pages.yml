name: Publish site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - monde/**
      - build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  # Pushes made with GITHUB_TOKEN by the scrape don't trigger other workflows
  workflow_run:
    workflows: ["Scrape Conseils aux Voyageurs"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.9

      - name: Build
        run: ./build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
