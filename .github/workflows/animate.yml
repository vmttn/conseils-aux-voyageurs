name: Animate Conseils aux Voyageurs

on:
  workflow_dispatch:
  schedule:
  - cron: '0 3 1 * *'

jobs:
  animate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.9

      - name: Animate
        run: make

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          blob=$(git hash-object -w animation.webp)
          tree=$(printf '100644 blob %s\tanimation.webp\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "feat: animate from $GITHUB_SHA")
          git push --force origin "$commit:refs/heads/animation"
